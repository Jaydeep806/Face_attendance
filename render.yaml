services:
  - type: web
    name: attendance-backend
    runtime: python
    rootDir: backend
    plan: 1c-2g
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 2 --timeout 600 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: facerecognition
      - key: COLLECTION_NAME
        value: students
      - key: THRESHOLD
        value: "0.6"
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: attendance-frontend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: attendance-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: attendance-backend
          envVarKey: RENDER_EXTERNAL_URL